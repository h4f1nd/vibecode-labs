<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>THERMAL//DOTS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="crt">
    <div class="scanlines" aria-hidden="true"></div>

    <header>
      <div class="brand">
        <span class="logo">▚</span>
        <span class="name">THERMAL<span class="slash">//</span>DOTS</span>
        <span class="ver" id="version">v1.0.0</span>
      </div>

      <div class="segmented" id="paperSwitch" role="group" aria-label="paper width">
        <button type="button" data-paper="58mm" class="on">58<small>mm</small></button>
        <button type="button" data-paper="80mm">80<small>mm</small></button>
        <button type="button" data-paper="custom">custom</button>
      </div>

      <input
        type="number"
        id="customWidth"
        class="mini hidden"
        min="64"
        max="2048"
        step="8"
        value="512"
        title="custom dot width"
      />

      <div class="head-right">
        <select id="preset" title="preset"></select>
        <button type="button" id="crtToggle" class="ghost" title="toggle CRT effect">CRT</button>
      </div>
    </header>

    <main>
      <section class="panel files">
        <h2>input</h2>
        <div class="dropzone" id="dropzone">
          <input type="file" id="fileInput" accept="image/*" multiple hidden />
          <p class="hint">
            drop images here<br />
            <span>or</span> <button type="button" class="link" id="browseBtn">browse</button>
          </p>
        </div>
        <ul class="filelist" id="fileList"></ul>
        <button type="button" class="ghost wide" id="clearBtn">clear all</button>
      </section>

      <section class="panel stage">
        <h2>
          preview
          <span class="right">
            <button type="button" class="link" id="zoomBtn">1:1</button>
            <button type="button" class="link" id="simBtn">paper</button>
          </span>
        </h2>
        <div class="paper" id="paper">
          <img id="preview" alt="converted preview" hidden />
          <div class="empty" id="empty">no image loaded<span class="cursor">_</span></div>
        </div>
        <div class="stats" id="stats">—</div>
      </section>

      <section class="panel controls">
        <h2>dither</h2>
        <div class="modes" id="modes"></div>

        <div class="fields">
          <label class="field">
            <span>gamma</span>
            <input
              type="range"
              id="gamma"
              min="0.4"
              max="2.6"
              step="0.05"
              value="1.2"
              title="higher = more ink (darker print); lower = lighter"
            />
            <output id="gammaOut">1.20</output>
          </label>
          <label class="field">
            <span>contrast</span>
            <input type="range" id="contrast" min="0.5" max="2.5" step="0.05" value="1.1" />
            <output id="contrastOut">1.10</output>
          </label>
          <label class="field">
            <span>brightness</span>
            <input type="range" id="brightness" min="-80" max="80" step="1" value="0" />
            <output id="brightnessOut">0</output>
          </label>
          <label class="field">
            <span>threshold</span>
            <input
              type="range"
              id="threshold"
              min="16"
              max="240"
              step="1"
              value="128"
              title="lower = more ink; 128 means auto for the 'mean' mode"
            />
            <output id="thresholdOut">128</output>
          </label>
        </div>

        <div class="row">
          <label class="select">
            <span>scale</span>
            <select id="scale">
              <option value="fit">fit</option>
              <option value="fill">fill</option>
              <option value="stretch">stretch</option>
            </select>
          </label>
          <label class="select">
            <span>rotate</span>
            <select id="rotate">
              <option value="0">0°</option>
              <option value="90">90°</option>
              <option value="180">180°</option>
              <option value="270">270°</option>
            </select>
          </label>
        </div>

        <div class="row">
          <label class="select">
            <span>margin</span>
            <input type="number" id="margin" class="mini" min="0" max="200" value="0" />
          </label>
          <label class="select">
            <span>height</span>
            <input
              type="number"
              id="maxHeight"
              class="mini"
              min="8"
              max="4000"
              placeholder="auto"
              title="max height in dots (needed by fill/stretch)"
            />
          </label>
        </div>

        <div class="row">
          <label class="check"><input type="checkbox" id="invert" /> invert</label>
          <label class="check"><input type="checkbox" id="border" /> border</label>
        </div>

        <h2>output</h2>
        <div class="row">
          <label class="select grow">
            <span>render</span>
            <select
              id="render"
              class="grow"
              title="PNG/BMP only: print keeps the paper dot grid; native renders at the source image's pixel width"
            >
              <option value="print">print · paper width</option>
              <option value="native">native · source width</option>
              <option value="1920">1920 px</option>
              <option value="2560">2560 px</option>
              <option value="3840">3840 px</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label class="select grow">
            <span>size</span>
            <select
              id="upscale"
              class="grow"
              title="PNG/BMP only: repeat each dot to enlarge the file; auto matches the source width"
            >
              <option value="1">1x · exact dots</option>
              <option value="2">2x</option>
              <option value="4">4x</option>
              <option value="8">8x</option>
              <option value="auto">auto · match source</option>
            </select>
          </label>
        </div>
        <div class="row">
          <select id="format" class="grow"></select>
          <button type="button" id="exportBtn" class="primary">export</button>
        </div>
        <div class="row escpos hidden" id="escposOpts">
          <label class="check"><input type="checkbox" id="escInit" checked /> init</label>
          <label class="select">
            <span>feed</span>
            <input type="number" id="escFeed" class="mini" min="0" max="99" value="3" />
          </label>
          <label class="check"><input type="checkbox" id="escCut" /> cut</label>
        </div>
        <label class="check subtle"><input type="checkbox" id="sidecar" checked /> write .json sidecar</label>
      </section>
    </main>

    <footer>
      <div class="status">
        <span class="prompt" id="statusIcon">&gt;</span>
        <span id="status">ready.</span>
      </div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <button type="button" class="link" id="logBtn">logs</button>
    </footer>

    <div class="toast" id="toast" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
