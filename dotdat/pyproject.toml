[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dotdat"
version = "0.1.0"
description = "Read-only viewer and exporter for Clarion 2.x DAT tables"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dotdat" }]
keywords = ["clarion", "dat", "database", "viewer", "legacy", "bcd"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.14",
  "Environment :: Win32 (MS Windows)",
  "Topic :: Database",
  "Topic :: Utilities",
]

dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
gui = ["pywebview>=5.0"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
dotdat = "dotdat.cli:main"

[project.urls]
Homepage = "https://github.com/h4f1nd/vibecode-labs/tree/main/dotdat"
Repository = "https://github.com/h4f1nd/vibecode-labs"
Issues = "https://github.com/h4f1nd/vibecode-labs/issues"
Releases = "https://github.com/h4f1nd/vibecode-labs/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/dotdat"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "benchmarks",
  "build",
  "docs",
  "README.md",
  "AGENTS.md",
  "CHANGELOG.md",
  "CLAUDE.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's option declarations are the function defaults by design.
"src/dotdat/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src/dotdat"]

[[tool.mypy.overrides]]
module = ["webview", "webview.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "realdata: needs the reference tables in DOTDAT_REFERENCE",
]
